# Demonstration workload; validate image supply chain and cluster policy before use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-demo
  labels:
    app: portfolio-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-demo
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: portfolio-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-demo
spec:
  selector:
    app: portfolio-demo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
# HPA requires a properly configured metrics source.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio-demo
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
